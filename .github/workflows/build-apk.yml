name: Compilar APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # Tests unitarios: corren aparte para no bloquear la publicación del APK.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Tests unitarios
        run: gradle :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-tests
          path: app/build/reports/tests/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # El runner ya trae el Android SDK; solo aceptamos licencias para que Gradle
      # pueda descargar la plataforma / build-tools que pida el proyecto.
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Firebase: pega el contenido de app/google-services.json en el secret GOOGLE_SERVICES_JSON
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::error::Falta el secret GOOGLE_SERVICES_JSON (Settings > Secrets and variables > Actions). Pega ahí el contenido de google-services.json de tu proyecto Firebase."
            exit 1
          fi

      # Opcional: MAPS_API_KEY solo para sugerencias de Google Places
      - name: .env
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then echo "MAPS_API_KEY=$MAPS_API_KEY" > .env; fi

      # Keystore de debug estable (secret DEBUG_KEYSTORE_BASE64) para poder actualizar
      # el APK sin desinstalar y para que el SHA-1 registrado en Firebase no cambie.
      - name: debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::warning::Sin DEBUG_KEYSTORE_BASE64: se genera un keystore nuevo en cada build."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Compilar
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Serafiel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # En main, el APK se publica como Release con un enlace fijo para el celular:
      # https://github.com/gbrss/Serafiel/releases/latest/download/Serafiel-debug.apk
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk Serafiel-debug.apk
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Serafiel-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Serafiel · compilación #${{ github.run_number }} ($SHORT_SHA)" \
            --notes "APK de debug compilado automáticamente desde el commit $SHORT_SHA de main. Instálalo encima de la versión anterior." \
            --latest
