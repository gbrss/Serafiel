name: Probar reglas de Firestore

on:
  push:
    paths:
      - "firestore.rules"
      - "firestore.test.js"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Dependencias
        run: npm install --no-save @firebase/rules-unit-testing firebase firebase-tools
      - name: Emulador + pruebas
        run: npx firebase emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"
